name: Deploy to Firebase Hosting on PR
on: pull_request

# Evita dois deploys ao mesmo tempo no mesmo PR
concurrency: 
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Primeiro trabalho: Lint e Testes
  lint_e_testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
        working-directory: ./frontend
      - run: npm run lint
        working-directory: ./frontend

  # Segundo trabalho: Build e Deploy de Pré-visualização
  build_and_preview:
    needs: lint_e_testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
        working-directory: ./frontend
        
      # Build com a variável exigida
      - run: npm run build
        working-directory: ./frontend
        env:
          STATIC_EXPORT: 'true'
          
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy_preview
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # ATENÇÃO: Mantenha o nome exato do seu secret original aqui!
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AILAB6_98EA2 }}
          projectId: ailab6-98ea2
          
      # Teste de fumaça exigido para a URL de pré-visualização
      - name: Teste de fumaça
        run: curl --fail ${{ steps.deploy_preview.outputs.details_url }}